[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "campus-cafe-brief"
version = "0.1.0"
description = "A CrewAI research team for a university cafe launch brief"
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai>=0.100.0",
    "ddgs>=9.0.0",
    "langchain-community>=0.3.0",
    "langchain-core>=0.3.0",
    "pandas>=2.2.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.49.0,<2.0.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0.0"]

[project.scripts]
campus-cafe-brief = "campus_cafe.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]